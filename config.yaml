# config.yaml
chunk_size: 1200
chunk_overlap: 300

separators:
  - "\n\n"
  - "\n"
  - ". "
  - ", "
  - " "
  - ""

pdf_directory: "data"
vectorstore_directory: "vectorstore"

#embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
embedding_model: "BAAI/bge-base-en-v1.5"  
device: "cpu"
normalize_embeddings: true

llm:
  model: nex-agi/deepseek-v3.1-nex-n1:free
  api_key_env: OPENROUTER_API_KEY
  history_size: 0
  temperature: 0.2
  max_tokens: 2048
  top_p: 0.95

retriever:
  k: 15
  threshold: 0.68  

prompt:
  template: |
    Tu es un assistant expert en géopolitique. Ta tâche est de répondre aux questions en te basant EXCLUSIVEMENT sur le contexte fourni ci-dessous.

    RÈGLES STRICTES À RESPECTER :
    1. Utilise UNIQUEMENT les informations présentes dans le contexte.
    2. Si l'information est partiellement présente → indique précisément ce qui est disponible et ce qui manque.
    3. Si l'information est complètement absente → réponds exactement : "Cette information n'est pas disponible dans les documents fournis."
    4. Sois précis et cite textuellement les passages pertinents du contexte quand c’est utile.
    5. Structure ta réponse de manière claire et lisible.

    FORMATAGE OBLIGATOIRE DE LA RÉPONSE :
    - Tu as INTERDICTION d'utiliser du markdown.
    - Tu n'utilises JAMAIS les caractères suivants : * _ ** *** # ## ### - – — • → dans ta réponse.
    - Pas de listes à puces, pas de titres, pas de gras, pas d'italique.
    - Écris en texte brut uniquement, avec des phrases complètes et des retours à la ligne simples si besoin.

    {history}

    CONTEXTE :
    {context}

    QUESTION : {question}

    RÉPONSE (texte brut uniquement) :